<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>레벨 테스트</title>
<style>
:root{--bg:#fff;--fg:#000;--mu:#707070;--line:#e4e4e4;--soft:#f4f4f4;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mu:#9a9a9a;--line:#2b2b2b;--soft:#141414}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mu:#9a9a9a;--line:#2b2b2b;--soft:#141414}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
.w{max-width:480px;margin:0 auto;padding:16px 20px 32px;min-height:100svh;display:flex;flex-direction:column;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.w{animation:none}}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.back{background:none;border:0;min-height:44px;min-width:56px;text-align:left;padding:0 12px 0 0;cursor:pointer;font-size:15px;font-weight:600}
.cnt{font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);margin:2px 0 28px}
.bar i{display:block;height:100%;background:var(--fg);transition:width .3s}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:700;color:var(--mu);margin:0 0 10px}
h1{font-size:clamp(34px,11vw,48px);line-height:1.1;letter-spacing:-.04em;font-weight:800;margin:0 0 12px}
.q{font-size:clamp(22px,6.4vw,26px);line-height:1.35;letter-spacing:-.03em;font-weight:800;margin:0}
.sub{font-size:14.5px;color:var(--mu);margin:10px 0 0}
.opts{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.o{display:block;width:100%;min-height:56px;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;cursor:pointer}
.o b{display:block;font-size:16px;font-weight:700;line-height:1.4}
.o span{display:block;font-size:13.5px;opacity:.6;margin-top:2px}
.o:active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
@media (hover:hover){.o:hover{border-color:var(--fg)}}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--fg);color:var(--bg);font-size:16px;font-weight:700;cursor:pointer;margin-top:auto}
.btn:active{opacity:.8}
.hero{margin:auto 0;padding:48px 0 32px}
.hero .sub{font-size:16px}
.res{margin:auto 0;padding:32px 0}
.big{font-size:clamp(52px,19vw,84px);line-height:1;font-weight:800;letter-spacing:-.05em;margin:0}
.meter{display:flex;gap:6px;margin:20px 0 24px}
.meter i{flex:1;height:6px;background:var(--line)}
.meter i.on{background:var(--fg)}
.name{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
.desc{font-size:16px;margin:0;color:var(--mu)}
.warn{background:var(--soft);border-left:3px solid var(--fg);padding:12px 14px;font-size:14.5px;margin-top:14px}
.res+.btn,.hero+.btn{margin-top:16px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
// opts: [제목, 설명, 점수(0-3)]
const Q=[
{id:'first',n:'중량운동 경험',t:'태어나서 중량운동(웨이트)을 해본 적이 있나요?',o:[
['처음이에요','바벨·덤벨·머신·케틀벨 등을 다뤄본 적이 없어요',0],
['해본 적 있어요','헬스장, PT, 크로스핏 등에서 한 번이라도 해봤어요',1]]},
{id:'pain',n:'신체 통증',t:'운동에 지장이 있을 만한 신체 통증이 있나요?',o:[
['없어요','평소 불편함 없이 활동해요',0],
['가끔 불편해요','특정 동작이나 피곤할 때만 느껴져요',1],
['자주 아프고 일부 동작이 힘들어요','쪼그려 앉기, 팔 들어올리기 등이 제한돼요',2],
['진단·수술 이력이 있거나 의사 운동 제한이 있어요','디스크, 인대 파열, 수술 후 회복 중 등',3]]},
{id:'hist',n:'중량운동 경력',t:'중량운동을 꾸준히(주 2회 이상) 해본 기간이 어느 정도인가요?',s:'헬스, PT, 크로스핏, 그룹 서킷 등 모두 포함',o:[
['3개월 미만','체험이나 짧게 해본 정도예요',0],
['3~6개월','한 번 꾸준히 해본 경험이 있어요',1],
['6개월~2년','여러 번 꾸준히 해왔어요',2],
['2년 이상','중량운동이 생활의 일부예요',3]]},
{g:'fs',id:'freq',n:'최근 운동 빈도',t:'최근 3개월간 운동은 어느 정도 하셨나요?',o:[
['거의 안 했어요','한 달에 1~2회 이하',0],
['주 1회 정도','',1],
['주 2~3회','',2],
['주 4회 이상','',3]]},
{g:'fs',id:'sport',n:'다른 운동 경험',t:'중량운동 말고, 다른 운동이나 스포츠를 해본 적이 있나요?',o:[
['거의 없어요','학교 체육 시간 외에 따로 한 운동이 없어요',0],
['가벼운 취미 정도예요','산책, 요가, 필라테스, 가벼운 등산, 가끔 자전거 등',1],
['규칙적으로 즐겼어요','러닝·수영·배드민턴·축구·농구·댄스 등을 1~3년 정도',2],
['오래, 활발하게 했어요','3년 이상 동호회·운동부·선수 수준 (구기·격투기·체조·무용 등)',3]]},
/* 운동 경험이 적은 회원: 일상 기반 질문 */
{g:'easy',id:'daily',n:'평소 활동량',t:'운동이 아닌 일상생활에서 하루 동안 얼마나 움직이시나요?',o:[
['거의 앉아서 지내요','사무직·운전 등으로 걷는 시간이 하루 30분 미만',0],
['가볍게 움직여요','출퇴근·산책 등으로 하루 30분~1시간 걷기',1],
['자주 움직여요','하루 1~2시간 걷거나, 서서 일하는 시간이 많아요',2],
['하루 대부분 움직여요','매장·현장·육아 등으로 종일 서서 걷고 움직여요',3]]},
{g:'easy',id:'stairs',n:'계단 오르기',t:'엘리베이터 없이 계단을 오른다면 어디까지 편하게 갈 수 있나요?',o:[
['2~3층만 올라도 숨이 차요','말하기 힘들 정도예요',0],
['4~5층, 숨은 차지만 말은 가능해요','',1],
['6~10층, 약간 숨찬 정도예요','',2],
['10층 이상도 거뜬해요','금방 회복돼요',3]]},
{g:'easy',id:'mob',n:'앉았다 일어서기',t:'바닥의 물건을 줍거나 쪼그려 앉았다가 일어설 때 몸은 어떤가요?',o:[
['무릎·허리가 부담돼서 피해요','일어날 때 무언가를 짚어야 해요',0],
['가능하지만 일어날 때 힘들어요','',1],
['편하게 할 수 있어요','',2],
['오래 쪼그려 앉아 있어도 편해요','일어설 때 균형도 안정적이에요',3]]},
{g:'easy',id:'pe',n:'학창시절 체육',t:'학창시절 체육 시간(달리기, 구기 종목 등)에는 어땠나요?',o:[
['잘 못하고 싫어했어요','달리기·공놀이가 늘 부담스러웠어요',0],
['평범한 편이었어요','',1],
['잘하는 편이었어요','오래달리기나 구기 종목에서 앞서는 편',2],
['반에서 손꼽히게 잘했어요','체육 대회 선수나 운동부 경험이 있어요',3]]},
/* 운동 경험이 있는 회원: 수행 능력 질문 */
{g:'exp',id:'wfreq',n:'최근 중량운동 빈도',t:'최근 3개월간 중량운동은 얼마나 자주 하셨나요?',o:[
['거의 못 했어요','한 달에 1~2회 이하',0],
['주 1회 정도','',1],
['주 2~3회','',2],
['주 4회 이상','',3]]},
{g:'exp',id:'skill',n:'해본 동작',t:'지금까지 해본 중량운동 동작 중 가장 높은 단계를 골라주세요',o:[
['머신, 가벼운 덤벨 위주','레그프레스, 랫풀다운, 덤벨 운동 등',0],
['바벨 기본 3종','바벨 스쿼트·데드리프트·벤치프레스',1],
['바벨·케틀벨 응용 동작','프론트 스쿼트, 오버헤드 프레스, 루마니안 데드리프트, 케틀벨 스윙 등',2],
['올림픽 리프팅·고난도 동작','클린, 스내치, 오버헤드 스쿼트, 머슬업 등',3]]},
{g:'exp',id:'lift',n:'스쿼트·데드리프트',t:'본인 몸무게 이상의 중량으로 스쿼트 또는 데드리프트를 할 수 있나요?',s:'바른 자세로 5회 이상 가능한 기준',o:[
['해본 적 없거나 맨몸만 해요','',0],
['몸무게보다 가볍게 해요','체중의 50~90%',1],
['몸무게 정도 들 수 있어요','체중의 100~130%',2],
['몸무게의 1.5배 이상 들 수 있어요','',3]]},
{g:'exp',id:'push',n:'팔굽혀펴기',t:'팔굽혀펴기(푸시업)를 바른 자세로 몇 개 할 수 있나요?',s:'가슴이 바닥 가까이 내려가는 기준',o:[
['1개도 어려워요','무릎을 대고 해도 힘들어요',0],
['무릎 대고 3개 이상 / 정자세 1~2개','',1],
['정자세 3~9개','',2],
['정자세 10개 이상','',3]]},
{g:'exp',id:'pull',n:'당기기 힘',t:'턱걸이(풀업)나 당기는 동작은 어느 정도 가능한가요?',o:[
['못 해요 / 해본 적 없어요','',0],
['밴드·머신 보조로 해요','',1],
['맨몸 1~4개','',2],
['맨몸 5개 이상','',3]]},
{g:'exp',id:'wod',n:'고강도 수업 경험',t:'크로스핏이나 그룹 서킷 같은 고강도 수업은 해본 적 있나요?',o:[
['해본 적 없어요','',0],
['몇 번 체험해봤어요','원데이·체험 수업 정도',1],
['3개월 이상 정기적으로 다녔어요','WOD나 서킷 수업을 주 2회 이상',2],
['1년 이상 다니고 있어요','고중량·고강도 수업을 소화하고 기록도 관리해요',3]]}
];
const W={hist:1,wfreq:1,skill:1,lift:2,push:1,pull:1,wod:1.5,freq:1,daily:1,stairs:1,mob:1,sport:1.5,pe:1};
const LV=[
{k:'Lv.1',nm:'입문',c:'#2f9e44',d:'기본 동작과 올바른 자세를 배우는 단계예요. 맨몸 중심 + 가벼운 중량으로 서킷에 적응해요.',tip:'첫 2주는 동작 숙지와 자세 교정 위주로 진행해요.'},
{k:'Lv.2',nm:'기초',c:'#1c7ed6',d:'기본 동작은 가능해요. 중량과 운동량을 점진적으로 늘려가는 단계예요.',tip:'스쿼트·푸시업·로우 패턴의 중량·횟수 향상에 집중해요.'},
{k:'Lv.3',nm:'중급',c:'#ae3ec9',d:'안정적인 체력과 자세를 갖춘 단계예요. 고강도 서킷과 복합 동작을 소화해요.',tip:'복합 리프트와 인터벌 강도를 높여 기록 향상을 노려요.'},
{k:'MASTER',nm:'마스터',c:'#212529',d:'상급자 단계예요. 고중량·고강도 프로그램과 응용 동작도 가능해요.',tip:'최상위 강도 클래스를 추천해요. 첫 수업에서 최대 수행 능력을 확인해요.'}];
let ans={},idx=0;
const app=document.getElementById('app');
const BASE=['first','pain','hist','freq'];
function path(){
 if(ans.first===0)return Q.filter(q=>['first','pain','sport','freq'].includes(q.id)||q.g==='easy');
 return Q.filter(q=>['first','pain','hist'].includes(q.id)||q.g==='exp')}
function total(){return path().length}
function clearGroups(){Q.forEach(q=>{if(q.g){delete ans[q.id];delete ans[q.id+'_t']}})}
function start(){ans={};idx=0;
app.innerHTML=`<div class="hero"><p class="eyebrow">CIRCUIT TRAINING</p><h1>레벨 테스트</h1><p class="sub">나에게 맞는 레벨을 찾아보세요.</p></div><button class="btn" onclick="show()">시작하기</button>`}
function show(){const p=path();if(idx>=p.length)return result();const q=p[idx];
app.innerHTML=`<div class="top"><button class="back" onclick="back()" ${idx?'':'style="visibility:hidden"'}>← 이전</button><span class="cnt">${idx+1} / ${total()}</span></div>
<div class="bar"><i style="width:${(idx+1)/total()*100}%"></i></div>
<h2 class="q">${q.t}</h2>${q.s?`<p class="sub">${q.s}</p>`:''}
<div class="opts">${q.o.map((o,i)=>`<button class="o" onclick="pick(${i})"><b>${o[0]}</b>${o[1]?`<span>${o[1]}</span>`:''}</button>`).join('')}</div>`;
window.scrollTo(0,0)}
function pick(i){const q=path()[idx];
if(q.id==='first')clearGroups();
if(q.id==='first'){['hist','freq'].forEach(k=>{delete ans[k];delete ans[k+'_t']})}
ans[q.id]=q.o[i][2];ans[q.id+'_t']=q.o[i][0];idx++;show()}
function back(){if(idx>0){idx--;const id=path()[idx].id;delete ans[id];delete ans[id+'_t'];show()}}
function result(){let lv,note=[];const p=path();
{let s=0,m=0;p.forEach(q=>{if(W[q.id]){s+=ans[q.id]*W[q.id];m+=3*W[q.id]}});const pct=s/m*100;
if(ans.first===0){lv=pct<50?0:1;note.push('중량운동이 처음이라 최대 Lv.2에서 시작해요. 첫 수업 후 레벨을 올릴 수 있어요.')}
else{lv=pct<30?0:pct<55?1:pct<80?2:3;
if(lv===3&&(ans.lift<2||ans.push<2||ans.pain>=2||ans.hist<2||ans.wfreq<2||ans.pull<1||ans.wod<2))lv=2;
if(lv>=2&&ans.lift<2){lv=1}
if(ans.hist===0)lv=Math.min(lv,1);else if(ans.hist===1)lv=Math.min(lv,2);}}
if(ans.pain>=3){lv=0;note.push('첫 수업 전 트레이너 상담이 필요해요.')}
else if(ans.pain===2){lv=Math.min(lv,2);note.push('통증 부위를 트레이너에게 꼭 알려주세요.')}
;
const L=LV[lv];
app.innerHTML=`<div class="res"><p class="eyebrow">YOUR LEVEL</p><p class="big">${L.k}</p>
<div class="meter">${[0,1,2,3].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div>
<h2 class="name">${L.nm} 레벨</h2><p class="desc">${L.d}</p>${note.map(n=>`<div class="warn">${n}</div>`).join('')}</div>
<button class="btn" onclick="start()">다시 테스트하기</button>`;window.scrollTo(0,0)}
start();
</script>
</body>
</html>
